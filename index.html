        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase handles
        window.firebaseApp = null;
        window.db = null;
        window.auth = null;
        window.userId = null;
        window.appId = typeof __app_id !== 'undefined' ? __app_id : 'universitys-store-default';
        
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDummyKeyForPreviewModeOnly12345",
            authDomain: "universitys-store.firebaseapp.com",
            projectId: "universitys-store",
            storageBucket: "universitys-store.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        try {
            window.firebaseApp = initializeApp(firebaseConfig);
            window.db = getFirestore(window.firebaseApp);
            window.auth = getAuth(window.firebaseApp);
            
            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            if (token) {
                signInWithCustomToken(window.auth, token).catch(() => signInAnonymously(window.auth));
            } else {
                signInAnonymously(window.auth).catch(err => console.log("Auth fallback:", err));
            }

            onAuthStateChanged(window.auth, (user) => {
                if (user) {
                    window.userId = user.uid;
                } else {
                    window.userId = 'guest_' + Math.random().toString(36).substring(2, 9);
                }
                if (window.appState && typeof window.appState.initApp === 'function') {
                    window.appState.initApp();
                }
            });
        } catch (e) {
            console.warn("Firebase offline mode fallback active", e);
            window.userId = 'offline_user';
            setTimeout(() => {
                if (window.appState && typeof window.appState.initApp === 'function') {
                    window.appState.initApp();
                }
            }, 500);
        }

        window.FB_UTILS = {
            signInWithEmailAndPassword,
            signOut
        };
    </script>

            initApp: function() {

            loadFromFirestore: async function() {
                if (!window.db) return;
                try {
                    // Load Categories
                    const catSnap = await getDocs(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'categories'));
                    if (!catSnap.empty) {
                        this.categories = catSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    } else {
                        for (let cat of this.categories) {
                            await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'categories', cat.id), cat);
                        }
                    }

                    // Load Products
                    const prodSnap = await getDocs(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'products'));
                    if (!prodSnap.empty) {
                        this.products = prodSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    } else {
                        for (let prod of this.products) {
                            await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'products', prod.id), prod);
                        }
                    }

                    // Load Reviews
                    const revSnap = await getDocs(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'reviews'));
                    if (!revSnap.empty) {
                        this.reviews = revSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    } else {
                        for (let rev of this.reviews) {
                            await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'reviews', rev.id), rev);
                        }
                    }

                    // Load Orders
                    const ordSnap = await getDocs(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders'));
                    if (!ordSnap.empty) {
                        this.orders = ordSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    }

                    this.render();
                } catch (e) {
                    console.log("Firestore sync info:", e);
                }
            },

                const id = 'toast_' + Date.now();
                const bg = type === 'success' ? 'bg-gold-500 text-darkBg' : 'bg-cardBg border border-gold-600 text-gold-200';
                container.innerHTML += `

                    productId: productId,
                    productName: p ? p.name : 'منتج',

                    status: 'جديد',

            submitReview: async function(e, productId) {
                e.preventDefault();
                const newRev = {

                    productId: productId,
                    customerName: document.getElementById('reviewName').value,
                    rating: parseInt(document.getElementById('reviewRating').value),

                e.preventDefault();
                if (!this.isAdmin) {
                    this.showToast('عذراً، هذه الصلاحية للمالك فقط', 'error');
                    return;
                }

                const colorsInput = document.getElementById('newProdColors').value;
                const colorsArr = colorsInput ? colorsInput.split(',').map(c => c.trim()).filter(Boolean) : [];

                const newP = {
                    id: 'prod-' + Date.now(),
                    name: document.getElementById('newProdName').value,
                    price: parseFloat(document.getElementById('newProdPrice').value),
                    category: document.getElementById('newProdCat').value,
                    stock: parseInt(document.getElementById('newProdStock').value),
                    images: [document.getElementById('newProdImg').value],
                    description: document.getElementById('newProdDesc').value,
                    specs: document.getElementById('newProdSpecs').value,
                    colors: colorsArr,
                    hidden: false,
                    rating: 5.0,
                    reviewsCount: 0,
                    createdAt: Date.now()
                };

                this.products.unshift(newP);
                await this.saveProductToFirestore(newP);
                this.closeModal();
                this.showToast('تم إضافة المنتج الجديد بنجاح', 'success');
                this.render();
            },

            openEditProductModal: function(productId) {
                const p = this.products.find(item => item.id === productId);
                if (!p) return;

                const modal = document.getElementById('modalContainer');
                modal.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                        <div class="bg-cardBg border border-gold-900/60 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                            <button onclick="appState.closeModal()" class="absolute top-4 left-4 text-gold-400 hover:text-gold-200 text-xl"><i class="fa-solid fa-xmark"></i></button>
                            <h2 class="text-xl font-bold text-gold-200 mb-6">تعديل بيانات المنتج</h2>
                            <form onsubmit="appState.updateProductSubmit(event, '${p.id}')" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">اسم المنتج *</label>
                                    <input type="text" id="editProdName" value="${p.name}" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100 focus:outline-none focus:border-gold-500">
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-gold-300 mb-1">السعر (ج.م) *</label>
                                        <input type="number" id="editProdPrice" value="${p.price}" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100 focus:outline-none focus:border-gold-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gold-300 mb-1">القسم *</label>
                                        <select id="editProdCat" class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100 focus:outline-none focus:border-gold-500">
                                            ${this.categories.map(c => `<option value="${c.name}" ${p.category === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gold-300 mb-1">المخزون *</label>
                                        <input type="number" id="editProdStock" value="${p.stock || 10}" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100 focus:outline-none focus:border-gold-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">رابط صورة المنتج *</label>
                                    <input type="url" id="editProdImg" value="${p.images && p.images[0] ? p.images[0] : ''}" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100 focus:outline-none focus:border-gold-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">وصف المنتج *</label>
                                    <textarea id="editProdDesc" required rows="2" class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100 focus:outline-none focus:border-gold-500">${p.description || ''}</textarea>
                                </div>
                                <button type="submit" class="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-darkBg font-bold py-3 rounded-xl shadow-lg text-xs mt-2">حفظ التعديلات</button>
                            </form>
                        </div>
                    </div>
                `;
            },

            updateProductSubmit: async function(e, productId) {
                e.preventDefault();
                if (!this.isAdmin) return;

                const idx = this.products.findIndex(item => item.id === productId);
                if (idx !== -1) {
                    this.products[idx].name = document.getElementById('editProdName').value;
                    this.products[idx].price = parseFloat(document.getElementById('editProdPrice').value);
                    this.products[idx].category = document.getElementById('editProdCat').value;
                    this.products[idx].stock = parseInt(document.getElementById('editProdStock').value);
                    this.products[idx].images = [document.getElementById('editProdImg').value];
                    this.products[idx].description = document.getElementById('editProdDesc').value;

                    await this.saveProductToFirestore(this.products[idx]);
                    this.closeModal();
                    this.showToast('تم تحديث المنتج بنجاح', 'success');
                    this.render();
                }
            },

            toggleProductVisibility: async function(productId) {
                if (!this.isAdmin) return;
                const p = this.products.find(item => item.id === productId);
                if (p) {
                    p.hidden = !p.hidden;
                    await this.saveProductToFirestore(p);
                    this.showToast('تم تحديث حالة الظهور', 'info');
                    this.render();
                }
            },

            deleteProduct: async function(productId) {
                if (!this.isAdmin) return;
                if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                    this.products = this.products.filter(item => item.id !== productId);
                    await this.deleteProductFromFirestore(productId);
                    this.showToast('تم حذف المنتج', 'success');
                    this.render();
                }
            },

            changeOrderStatus: async function(orderId, status) {
                if (!this.isAdmin) return;
                const o = this.orders.find(item => item.id === orderId);
                if (o) {
                    o.status = status;
                    await this.updateOrderStatusInFirestore(orderId, status);
                    this.showToast('تم تحديث حالة الطلب', 'success');
                }
            },

            openAddCategoryModal: function() {
                if (!this.isAdmin) return;
                const modal = document.getElementById('modalContainer');
                modal.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                        <div class="bg-cardBg border border-gold-900/60 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl relative">
                            <button onclick="appState.closeModal()" class="absolute top-4 left-4 text-gold-400 hover:text-gold-200 text-xl"><i class="fa-solid fa-xmark"></i></button>
                            <h2 class="text-xl font-bold text-gold-200 mb-4">إضافة قسم جديد</h2>
                            <form onsubmit="appState.saveNewCategory(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">اسم القسم *</label>
                                    <input type="text" id="newCatName" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100 focus:outline-none focus:border-gold-500">
                                </div>
                                <button type="submit" class="w-full bg-gold-500 text-darkBg font-bold py-3 rounded-xl text-xs">إضافة القسم</button>
                            </form>
                        </div>
                    </div>
                `;
            },

            saveNewCategory: async function(e) {
                e.preventDefault();
                if (!this.isAdmin) return;
                const name = document.getElementById('newCatName').value.trim();
                if (!name) return;
                const newC = { id: 'cat-' + Date.now(), name, icon: 'fa-mobile', image: 'https://placehold.co/400x300' };
                this.categories.push(newC);
                this.closeModal();
                this.showToast('تم إضافة القسم بنجاح', 'success');
                this.render();
            },

            deleteCategory: async function(catId) {
                if (!this.isAdmin) return;
                this.categories = this.categories.filter(c => c.id !== catId);
                this.showToast('تم حذف القسم', 'success');
                this.render();
            },

            deleteReview: async function(revId) {
                if (!this.isAdmin) return;
                this.reviews = this.reviews.filter(r => r.id !== revId);
                await this.deleteReviewFromFirestore(revId);
                this.showToast('تم حذف التقييم', 'success');
                this.render();
            }
        };

        window.onload = function() {
            appState.render();
        };
    </script>
</body>
</html>
