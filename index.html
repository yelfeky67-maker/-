    <script>
        const DEFAULT_SUPABASE_URL = 'https://jiwuhyxbgdemizsqjrcf.supabase.co';
        const DEFAULT_SUPABASE_ANON_KEY = 'sb_publishable_6UYZL6pFdito2ikMiBZ8DQ_AY5r1l36';

        const SUPABASE_URL = localStorage.getItem('supabase_url') || DEFAULT_SUPABASE_URL;
        const SUPABASE_ANON_KEY = localStorage.getItem('supabase_anon_key') || DEFAULT_SUPABASE_ANON_KEY;

        window.supabaseClient = null;
        try {
            if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
                // Validate URL format before creating client to prevent runtime exceptions
                new URL(SUPABASE_URL);
                window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                });
            }
        } catch (e) {
            console.warn("Supabase init warning or invalid URL. Falling back to local/demo mode safely:", e);
            // Clear corrupted URL if invalid
            if (localStorage.getItem('supabase_url')) {
                localStorage.removeItem('supabase_url');
            }
        }

            checkAuthSession: async function() {
                const savedAdmin = localStorage.getItem('universitys_admin_logged');
                if (savedAdmin === 'true') {
                    this.isAdmin = true;
                    this.currentUser = { email: 'yelfeky67@gmail.com' };
                    return;
                }

                if (!window.supabaseClient) return;
                try {
                    const { data: { session }, error } = await window.supabaseClient.auth.getSession();
                    if (session && session.user) {
                        this.currentUser = session.user;
                        this.isAdmin = session.user.email === 'yelfeky67@gmail.com';
                    }
                } catch (e) {
                    console.error("Session check warning:", e);
                }
            },

            loadFromSupabase: async function() {
                if (!window.supabaseClient) {
                    this.loadDefaultDemoData();
                    this.render();
                    return;
                }

                try {
                    const { data: prodData, error: prodErr } = await window.supabaseClient
                        .from('products')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (prodErr) {
                        console.warn("Supabase query error (products table might not be created yet):", prodErr.message);
                        this.loadDefaultDemoData();
                        this.render();
                        return;
                    }

                    if (prodData && prodData.length > 0) {
                        this.products = prodData.map(p => ({
                            id: p.id,
                            name: p.name,
                            category: p.category,
                            price: Number(p.price) || 0,
                            images: p.images || [],
                            description: p.description,
                            specs: p.specs,
                            colors: p.colors || [],
                            stock: p.stock !== undefined ? p.stock : 20,
                            hidden: p.hidden || false,
                            rating: p.rating || 5.0,
                            createdAt: new Date(p.created_at).getTime()
                        }));
                    } else {
                        await this.seedInitialProducts();
                    }

                    const { data: ordData, error: ordErr } = await window.supabaseClient
                        .from('orders')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (!ordErr && ordData) {
                        this.orders = ordData.map(o => ({
                            id: o.id,
                            productId: o.product_id,
                            productName: o.product_name,
                            unitPrice: Number(o.unit_price) || 0,
                            totalPrice: Number(o.total_price) || 0,
                            quantity: o.quantity,
                            color: o.color,
                            customerName: o.customer_name,
                            phone: o.phone,
                            governorate: o.governorate,
                            address: o.address,
                            status: o.status || 'جديد',
                            date: o.created_at ? o.created_at.split('T')[0] : ''
                        }));
                    }

                    const { data: revData, error: revErr } = await window.supabaseClient
                        .from('reviews')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (!revErr && revData) {
                        this.reviews = revData.map(r => ({
                            id: r.id,
                            productId: r.product_id,
                            customerName: r.customer_name,
                            rating: r.rating,
                            comment: r.comment,
                            date: r.created_at ? r.created_at.split('T')[0] : ''
                        }));
                    }

                    this.render();
                } catch (e) {
                    console.error("Supabase connection error:", e);
                    this.loadDefaultDemoData();
                    this.render();
                }
            },

            seedInitialProducts: async function() {
                if (!window.supabaseClient) return;
                this.loadDefaultDemoData();
                for (let p of this.products) {
                    await window.supabaseClient.from('products').insert([{
                        id: p.id,
                        name: p.name,
                        category: p.category,
                        price: p.price,
                        images: p.images,
                        description: p.description,
                        specs: p.specs,
                        colors: p.colors,
                        stock: p.stock,
                        hidden: p.hidden,
                        rating: p.rating
                    }]).catch(err => console.log('Seed note:', err));
                }
            },

            saveSupabaseConfig: function(e) {
                e.preventDefault();
                let url = document.getElementById('configSupabaseUrl').value.trim();
                const key = document.getElementById('configSupabaseKey').value.trim();

                // Clean up trailing slashes
                if (url.endsWith('/')) {
                    url = url.slice(0, -1);
                }

                try {
                    new URL(url);
                } catch (err) {
                    this.showToast('رابط Supabase غير صحيح. يرجى التأكد من الرابط.', 'error');
                    return;
                }

                localStorage.setItem('supabase_url', url);
                localStorage.setItem('supabase_anon_key', key);
                
                this.closeModal();
                this.showToast('تم حفظ الإعدادات، جاري إعادة تحميل الصفحة...', 'success');
                setTimeout(() => window.location.reload(), 1000);
            },

            handleAdminLogin: async function(e) {

                    localStorage.setItem('universitys_admin_logged', 'true');
                    this.isAdmin = true;
                    this.currentUser = { email: 'yelfeky67@gmail.com' };

                            email: email,
                            password: pass
                        });
                        if (!error && data && data.user) {
                            this.currentUser = data.user;

                            this.closeModal();
                            this.updateAuthNav();
                            router.navigate('admin');

                            return;

                    } catch (err) {
                        console.warn(err);
                    }
                }

                this.showToast('بريد المدير المعتمد هو yelfeky67@gmail.com', 'error');

            logoutAdmin: async function() {
                localStorage.removeItem('universitys_admin_logged');
                if (window.supabaseClient) {
                    await window.supabaseClient.auth.signOut().catch(() => {});
                }
                this.currentUser = null;

            handleSearch: function(queryText) {
                this.searchQuery = queryText.trim().toLowerCase();
                if (router.currentRoute !== 'home' && router.currentRoute !== 'category') {
                    router.navigate('home');
                } else {
                    this.render();
                }
            },

            showToast: function(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const id = 'toast_' + Date.now();
                const bg = type === 'success' ? 'bg-gold-500 text-darkBg' : (type === 'error' ? 'bg-red-950 border border-red-500 text-red-200' : 'bg-cardBg border border-gold-600 text-gold-200');
                container.innerHTML += `
                    <div id="${id}" class="${bg} px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2 pointer-events-auto transition-all animate-bounce">
                        <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info')} text-base"></i>
                        <span>${message}</span>
                    </div>
                `;
                setTimeout(() => {
                    const el = document.getElementById(id);
                    if (el) el.remove();
                }, 4000);
            },

            render: function() {
                const container = document.getElementById('mainContent');
                if (!container) return;

                if (router.currentRoute === 'home') {
                    container.innerHTML = this.renderHome();
                } else if (router.currentRoute === 'category') {
                    container.innerHTML = this.renderCategoryProducts(router.params.categoryName);
                } else if (router.currentRoute === 'product') {
                    container.innerHTML = this.renderProductDetails(router.params.productId);
                } else if (router.currentRoute === 'admin') {
                    if (!this.isAdmin) {
                        router.navigate('home');
                        return;
                    }
                    container.innerHTML = this.renderAdminDashboard();
                }

                const input = document.getElementById('orderQtyInput');

                let current = parseInt(input.value) || 1;
                current += val;
                if (current < 1) current = 1;
                input.value = current;

            submitOrder: async function(e, productId, qty, color, unitPrice) {
                e.preventDefault();
                const p = this.products.find(item => item.id === productId);
                const newOrder = {
                    id: 'ord-' + Date.now(),
                    product_id: productId,
                    product_name: p ? p.name : 'منتج',
                    unit_price: unitPrice,
                    total_price: unitPrice * qty,
                    quantity: qty,
                    color: color,
                    customer_name: document.getElementById('custName').value,
                    phone: document.getElementById('custPhone').value,
                    governorate: document.getElementById('custGov').value,
                    address: document.getElementById('custAddress').value,
                    status: 'جديد'
                };

                if (window.supabaseClient) {
                    await window.supabaseClient.from('orders').insert([newOrder]).catch(() => {});
                }

                this.orders.unshift({
                    id: newOrder.id,
                    productId: newOrder.product_id,
                    productName: newOrder.product_name,
                    unitPrice: newOrder.unit_price,
                    totalPrice: newOrder.total_price,
                    quantity: newOrder.quantity,
                    color: newOrder.color,
                    customerName: newOrder.customer_name,
                    phone: newOrder.phone,
                    governorate: newOrder.governorate,
                    address: newOrder.address,
                    status: newOrder.status,
                    date: new Date().toISOString().split('T')[0]
                });

                this.closeModal();
                this.showToast('تم استلام طلبك بنجاح وحفظه في قاعدة البيانات!', 'success');
            },

            submitReview: async function(e, productId) {
                e.preventDefault();
                const newRev = {
                    id: 'rev-' + Date.now(),
                    product_id: productId,
                    customer_name: document.getElementById('revName').value,
                    rating: parseInt(document.getElementById('revRating').value),
                    comment: document.getElementById('revComment').value
                };

                if (window.supabaseClient) {
                    await window.supabaseClient.from('reviews').insert([newRev]).catch(() => {});
                }

                this.reviews.push({
                    id: newRev.id,
                    productId: newRev.product_id,
                    customerName: newRev.customer_name,
                    rating: newRev.rating,
                    comment: newRev.comment,
                    date: new Date().toISOString().split('T')[0]
                });

                this.showToast('تم إضافة تقييمك بنجاح وحفظه في القاعدة', 'success');
                this.render();
            },

                            <button onclick="appState.closeModal()" class="absolute top-4 left-4 text-gold-400 hover:text-gold-200 text-xl"><i class="fa-solid fa-xmark"></i></button>

                            <form onsubmit="appState.saveNewProduct(event)" class="space-y-4">
                                <div>

                                        <label class="block text-xs font-semibold text-gold-300 mb-1">القسم *</label>
                                        <select id="newProdCat" class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">

                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gold-300 mb-1">المخزون *</label>
                                        <input type="number" id="newProdStock" value="20" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">رابط صورة المنتج *</label>
                                    <input type="url" id="newProdImg" required placeholder="https://..." class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">وصف المنتج *</label>
                                    <textarea id="newProdDesc" required rows="2" class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100"></textarea>
                                </div>

                                    <label class="block text-xs font-semibold text-gold-300 mb-1">الألوان المتاحة (مفصولة بفاصلة)</label>
                                    <input type="text" id="newProdColors" placeholder="أسود، أبيض، ذهبي" class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">
                                </div>
                                <button type="submit" class="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-darkBg font-bold py-3 rounded-xl shadow-lg text-xs mt-2">حفظ وإضافة المنتج في Supabase</button>
                            </form>
                        </div>
                    </div>
                `;
            },

            saveNewProduct: async function(e) {
                e.preventDefault();
                const colorsInput = document.getElementById('newProdColors').value.trim();
                const colorsArr = colorsInput ? colorsInput.split(',').map(c => c.trim()) : [];

                const prodId = 'prod-' + Date.now();
                const dbPayload = {
                    id: prodId,
                    name: document.getElementById('newProdName').value,
                    price: parseFloat(document.getElementById('newProdPrice').value),
                    category: document.getElementById('newProdCat').value,
                    stock: parseInt(document.getElementById('newProdStock').value),
                    images: [document.getElementById('newProdImg').value],
                    description: document.getElementById('newProdDesc').value,
                    colors: colorsArr,
                    hidden: false,
                    rating: 5.0
                };

                if (window.supabaseClient) {
                    const { error } = await window.supabaseClient.from('products').insert([dbPayload]);
                    if (error) {
                        console.error("Supabase insert error:", error);
                        this.showToast('خطأ في قاعدة البيانات: ' + error.message, 'error');
                        return;
                    }
                }

                this.products.unshift({
                    ...dbPayload,
                    createdAt: Date.now()
                });

                this.closeModal();
                this.showToast('تم إضافة المنتج وحفظه بنجاح في Supabase!', 'success');
                this.render();
            },

            openEditProductModal: function(productId) {
                const p = this.products.find(item => item.id === productId);
                if (!p) return;

                const modal = document.getElementById('modalContainer');
                modal.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                        <div class="bg-cardBg border border-gold-900/60 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                            <button onclick="appState.closeModal()" class="absolute top-4 left-4 text-gold-400 hover:text-gold-200 text-xl"><i class="fa-solid fa-xmark"></i></button>
                            <h2 class="text-xl font-bold text-gold-200 mb-6">تعديل بيانات المنتج وحفظها في Supabase</h2>
                            <form onsubmit="appState.updateProductSubmit(event, '${p.id}')" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">اسم المنتج *</label>
                                    <input type="text" id="editProdName" value="${p.name}" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-gold-300 mb-1">السعر (ج.م) *</label>
                                        <input type="number" id="editProdPrice" value="${p.price}" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gold-300 mb-1">القسم *</label>
                                        <select id="editProdCat" class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">
                                            ${this.categories.map(c => `<option value="${c.name}" ${p.category === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gold-300 mb-1">المخزون *</label>
                                        <input type="number" id="editProdStock" value="${p.stock || 10}" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">رابط صورة المنتج *</label>
                                    <input type="url" id="editProdImg" value="${p.images && p.images[0] ? p.images[0] : ''}" required class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gold-300 mb-1">وصف المنتج *</label>
                                    <textarea id="editProdDesc" required rows="2" class="w-full bg-darkBg border border-gold-900/60 rounded-xl px-4 py-2 text-xs text-gold-100">${p.description || ''}</textarea>
                                </div>
                                <button type="submit" class="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-darkBg font-bold py-3 rounded-xl shadow-lg text-xs mt-2">حفظ التعديلات في Supabase</button>
                            </form>
                        </div>
                    </div>
                `;
            },

            updateProductSubmit: async function(e, productId) {
                e.preventDefault();
                const updatedData = {
                    name: document.getElementById('editProdName').value,
                    price: parseFloat(document.getElementById('editProdPrice').value),
                    category: document.getElementById('editProdCat').value,
                    stock: parseInt(document.getElementById('editProdStock').value),
                    images: [document.getElementById('editProdImg').value],
                    description: document.getElementById('editProdDesc').value
                };

                if (window.supabaseClient) {
                    await window.supabaseClient.from('products').update(updatedData).eq('id', productId).catch(() => {});
                }

                const idx = this.products.findIndex(item => item.id === productId);
                if (idx !== -1) {
                    this.products[idx] = { ...this.products[idx], ...updatedData };
                }

                this.closeModal();
                this.showToast('تم تحديث المنتج وحفظه بنجاح في Supabase', 'success');
                this.render();
            },

            toggleHideProduct: async function(productId) {
                const p = this.products.find(item => item.id === productId);
                if (p) {
                    p.hidden = !p.hidden;
                    if (window.supabaseClient) {
                        await window.supabaseClient.from('products').update({ hidden: p.hidden }).eq('id', productId).catch(() => {});
                    }
                    this.showToast(p.hidden ? 'تم إخفاء المنتج مؤقتاً' : 'تم إظهار المنتج', 'info');
                    this.render();
                }
            },

            deleteProduct: async function(productId) {
                if (window.supabaseClient) {
                    await window.supabaseClient.from('products').delete().eq('id', productId).catch(() => {});
                }
                this.products = this.products.filter(item => item.id !== productId);
                this.showToast('تم حذف المنتج نهائياً من قاعدة بيانات Supabase', 'success');
                this.render();
            }
        };

        window.onload = function() {
            appState.initApp();
        };
    </script>
</body>
